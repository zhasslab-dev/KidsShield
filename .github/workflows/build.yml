Падение Foreground Service на Android 14 (targetSdk 34): добавил обязательное свойство android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE в AndroidManifest.xml и передачу флага ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE в startForeground(), без которых приложение аварийно завершалось с MissingForegroundServiceTypeException.

Отсутствие INTERNET и пересылка DNS-пакетов в AdBlockVpnService: добавил разрешение android.permission.INTERNET и обработчик UDP-пакетов для маршрутов 94.140.14.15/32 и 94.140.15.16/32 через защищённый protect(socket) сокет (ранее трафик к DNS уходил в TUN-интерфейс без чтения и блокировал доступ в интернет).

Разрешение на уведомления для Android 13+: добавил запрос POST_NOTIFICATIONS в MainActivity перед запуском VPN-сервиса и шаг android-actions/setup-android@v3 для стабильной сборки в GitHub Actions.

