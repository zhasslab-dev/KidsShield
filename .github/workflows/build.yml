              package com.example.kidsadblocker

              import android.app.Notification

              import android.app.NotificationChannel

              import android.app.NotificationManager

              import android.app.PendingIntent

              import android.content.Intent

              import android.net.VpnService

              import android.os.Build

              import android.os.ParcelFileDescriptor

              import androidx.core.app.NotificationCompat



              class AdBlockVpnService : VpnService() {

                  private var vpnInterface: ParcelFileDescriptor? = null

                  companion object {

                      var isRunning = false

                      const val ACTION_STOP = "ACTION_STOP_VPN"

                      private const val CHANNEL_ID = "KidsShieldChannel"

                      private const val NOTIFICATION_ID = 101

                  }

                  override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {

                      if (intent?.action == ACTION_STOP) {

                          stopVpn()

                          return START_NOT_STICKY

                      }

                      startForegroundServiceWithNotification()

                      startVpn()

                      return START_STICKY

                  }

                  private fun startVpn() {

                      if (vpnInterface != null) return

                      try {

                          val builder = Builder()

                          builder.setSession("KidsShieldVPN")

                          builder.setMtu(1500)

                          builder.addAddress("10.0.0.2", 32)

                          val dns1 = "94.140.14.15"

                          val dns2 = "94.140.15.16"

                          builder.addDnsServer(dns1)

                          builder.addDnsServer(dns2)

                          builder.addRoute(dns1, 32)

                          builder.addRoute(dns2, 32)

                          vpnInterface = builder.establish()

                          isRunning = true

                      } catch (e: Exception) {

                          e.printStackTrace()

                          stopVpn()

                      }

                  }

                  private fun startForegroundServiceWithNotification() {

                      val manager = getSystemService(NotificationManager::class.java)

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {

                          val channel = NotificationChannel(CHANNEL_ID, "Статус защиты", NotificationManager.IMPORTANCE_LOW)

                          manager.createNotificationChannel(channel)

                      }

                      val pendingIntent = PendingIntent.getActivity(

                          this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE

                      )

                      val notification: Notification = NotificationCompat.Builder(this, CHANNEL_ID)

                          .setContentTitle("🛡️ Детский Щит активен")

                          .setContentText("Реклама в мини-играх и браузере заблокирована")

                          .setSmallIcon(android.R.drawable.ic_secure)

                          .setContentIntent(pendingIntent)

                          .setOngoing(true)

                          .build()

                      startForeground(NOTIFICATION_ID, notification)

                  }

                  private fun stopVpn() {

                      try { vpnInterface?.close() } catch (e: Exception) { e.printStackTrace() }

                      finally {

                          vpnInterface = null

                          isRunning = false

                          stopForeground(true)

                          stopSelf()

                      }

                  }

                  override fun onDestroy() {

                      stopVpn()

                      super.onDestroy()

                  }

              }

          """)



