name: Build KidsShield (Android, Windows, Apple)



on:

  push:

  workflow_dispatch:



jobs:

  build-android:

    name: Build Android APK

    runs-on: ubuntu-latest



    steps:

      - name: Set up JDK 17

        uses: actions/setup-java@v5

        with:

          distribution: 'temurin'

          java-version: '17'



      - name: Set up Android SDK

        uses: android-actions/setup-android@v3



      - name: Generate Android Project via Python

        shell: python

        run: |

          import os

          import textwrap



          def write(path, content):

              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)

              with open(path, "w", encoding="utf-8") as f:

                  f.write(textwrap.dedent(content).strip() + "\n")



          write("settings.gradle", """

              pluginManagement {

                  repositories {

                      google()

                      mavenCentral()

                      gradlePluginPortal()

                  }

              }

              dependencyResolutionManagement {

                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

                  repositories {

                      google()

                      mavenCentral()

                  }

              }

              rootProject.name = "KidsShield"

              include ":app"

          """)



          write("gradle.properties", """

              org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

              android.useAndroidX=true

              kotlin.code.style=official

          """)



          write("build.gradle", """

              plugins {

                  id "com.android.application" version "8.2.0" apply false

                  id "org.jetbrains.kotlin.android" version "1.9.20" apply false

              }

          """)



          write("app/build.gradle", """

              plugins {

                  id "com.android.application"

                  id "org.jetbrains.kotlin.android"

              }

              android {

                  namespace "com.example.kidsadblocker"

                  compileSdk 34

                  defaultConfig {

                      applicationId "com.example.kidsadblocker"

                      minSdk 24

                      targetSdk 34

                      versionCode 1

                      versionName "1.0"

                  }

                  compileOptions {

                      sourceCompatibility JavaVersion.VERSION_17

                      targetCompatibility JavaVersion.VERSION_17

                  }

                  kotlinOptions {

                      jvmTarget = "17"

                  }

              }

              dependencies {

                  implementation "androidx.core:core-ktx:1.12.0"

                  implementation "androidx.appcompat:appcompat:1.6.1"

                  implementation "com.google.android.material:material:1.11.0"

              }

          """)



          write("app/src/main/AndroidManifest.xml", """

              <?xml version="1.0" encoding="utf-8"?>

              <manifest xmlns:android="http://schemas.android.com/apk/res/android">

                  <uses-permission android:name="android.permission.INTERNET" />

                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

                  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />



                  <application

                      android:allowBackup="true"

                      android:icon="@android:drawable/ic_secure"

                      android:label="Детский Щит"

                      android:supportsRtl="true"

                      android:theme="@style/Theme.AppCompat.NoActionBar">

                      <activity

                          android:name=".MainActivity"

                          android:exported="true"

                          android:screenOrientation="portrait">

                          <intent-filter>

                              <action android:name="android.intent.action.MAIN" />

                              <category android:name="android.intent.category.LAUNCHER" />

                          </intent-filter>

                      </activity>

                      <service

                          android:name=".AdBlockVpnService"

                          android:permission="android.permission.BIND_VPN_SERVICE"

                          android:foregroundServiceType="specialUse"

                          android:exported="true">

                          <property

                              android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"

                              android:value="vpn_dns_adblocker" />

                          <intent-filter>

                              <action android:name="android.net.VpnService" />

                          </intent-filter>

                      </service>

                  </application>

              </manifest>

          """)



          write("app/src/main/res/layout/activity_main.xml", """

              <?xml version="1.0" encoding="utf-8"?>

              <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"

                  android:layout_width="match_parent"

                  android:layout_height="match_parent"

                  android:orientation="vertical"

                  android:gravity="center_horizontal"

                  android:padding="24dp"

                  android:background="#121824">

                  <TextView

                      android:layout_width="wrap_content"

                      android:layout_height="wrap_content"

                      android:text="ДЕТСКИЙ ЩИТ"

                      android:textSize="28sp"

                      android:textStyle="bold"

                      android:textColor="#FFFFFF"

                      android:layout_marginTop="32dp"/>

                  <TextView

                      android:layout_width="wrap_content"

                      android:layout_height="wrap_content"

                      android:text="Блокировка рекламы в играх и браузере"

                      android:textSize="14sp"

                      android:textColor="#8A99AD"

                      android:layout_marginTop="8dp"

                      android:layout_marginBottom="48dp"/>

                  <LinearLayout

                      android:layout_width="match_parent"

                      android:layout_height="wrap_content"

                      android:orientation="vertical"

                      android:gravity="center"

                      android:padding="28dp"

                      android:background="#1E2638"

                      android:layout_marginBottom="48dp">

                      <TextView

                          android:id="@+id/tvShieldIcon"

                          android:layout_width="wrap_content"

                          android:layout_height="wrap_content"

                          android:text="⚠️"

                          android:textSize="56sp"

                          android:layout_marginBottom="12dp"/>

                      <TextView

                          android:id="@+id/tvStatusTitle"

                          android:layout_width="wrap_content"

                          android:layout_height="wrap_content"

                          android:text="ЗАЩИТА ОТКЛЮЧЕНА"

                          android:textSize="20sp"

                          android:textStyle="bold"

                          android:textColor="#FF5252"/>

                      <TextView

                          android:id="@+id/tvStatusDesc"

                          android:layout_width="wrap_content"

                          android:layout_height="wrap_content"

                          android:text="Реклама в мини-играх не блокируется"

                          android:textSize="14sp"

                          android:textColor="#8A99AD"

                          android:gravity="center"

                          android:layout_marginTop="6dp"/>

                  </LinearLayout>

                  <Button

                      android:id="@+id/btnPower"

                      android:layout_width="match_parent"

                      android:layout_height="76dp"

                      android:text="ВКЛЮЧИТЬ РУБИЛЬНИК"

                      android:textSize="18sp"

                      android:textStyle="bold"

                      android:textColor="#FFFFFF"

                      android:backgroundTint="#00C853"/>

                  <TextView

                      android:layout_width="wrap_content"

                      android:layout_height="wrap_content"

                      android:text="🔒 Выключение защищено ПИН-кодом (0000)"

                      android:textSize="13sp"

                      android:textColor="#5C6B7F"

                      android:layout_marginTop="32dp"/>

              </LinearLayout>

          """)



          write("app/src/main/java/com/example/kidsadblocker/AdBlockVpnService.kt", """

              package com.example.kidsadblocker



              import android.app.Notification

              import android.app.NotificationChannel

              import android.app.NotificationManager

              import android.app.PendingIntent

              import android.content.Intent

              import android.content.pm.ServiceInfo

              import android.net.VpnService

              import android.os.Build

              import android.os.ParcelFileDescriptor

              import androidx.core.app.NotificationCompat

              import androidx.core.app.ServiceCompat

              import java.io.FileInputStream

              import java.io.FileOutputStream

              import java.net.DatagramPacket

              import java.net.DatagramSocket

              import java.net.InetAddress

              import java.util.concurrent.atomic.AtomicBoolean



              class AdBlockVpnService : VpnService() {

                  private var vpnInterface: ParcelFileDescriptor? = null

                  private var vpnThread: Thread? = null

                  private val shouldRun = AtomicBoolean(false)



                  companion object {

                      @Volatile

                      var isRunning = false

                      const val ACTION_STOP = "ACTION_STOP_VPN"

                      private const val CHANNEL_ID = "KidsShieldChannel"

                      private const val NOTIFICATION_ID = 101

                  }



                  override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {

                      if (intent?.action == ACTION_STOP) {

                          stopVpn()

                          return START_NOT_STICKY

                      }

                      startForegroundServiceWithNotification()

                      startVpn()

                      return START_STICKY

                  }



                  private fun startVpn() {

                      if (vpnInterface != null) return

                      try {

                          val dns1 = "94.140.14.15"

                          val dns2 = "94.140.15.16"

                          val builder = Builder()

                              .setSession("KidsShieldVPN")

                              .setMtu(1500)

                              .addAddress("10.0.0.2", 32)

                              .addDnsServer(dns1)

                              .addDnsServer(dns2)

                              .addRoute(dns1, 32)

                              .addRoute(dns2, 32)



                          vpnInterface = builder.establish()

                          if (vpnInterface == null) {

                              stopVpn()

                              return

                          }

                          isRunning = true

                          shouldRun.set(true)

                          startDnsForwarder()

                      } catch (e: Exception) {

                          e.printStackTrace()

                          stopVpn()

                      }

                  }



                  private fun startDnsForwarder() {

                      val pfd = vpnInterface ?: return

                      vpnThread = Thread {

                          val inputStream = FileInputStream(pfd.fileDescriptor)

                          val outputStream = FileOutputStream(pfd.fileDescriptor)

                          val packet = ByteArray(32767)

                          while (shouldRun.get()) {

                              try {

                                  val length = inputStream.read(packet)

                                  if (length <= 0) continue

                                  handlePacket(packet, length, outputStream)

                              } catch (e: Exception) {

                                  if (shouldRun.get()) e.printStackTrace()

                                  break

                              }

                          }

                      }.apply {

                          name = "KidsShieldDnsThread"

                          isDaemon = true

                          start()

                      }

                  }



                  private fun handlePacket(packet: ByteArray, length: Int, outputStream: FileOutputStream) {

                      val version = (packet[0].toInt() ushr 4) and 0x0F

                      if (version != 4 || length < 28) return

                      val ihl = (packet[0].toInt() and 0x0F) * 4

                      val protocol = packet[9].toInt() and 0xFF

                      if (protocol != 17 || length < ihl + 8) return



                      val srcIp = packet.copyOfRange(12, 16)

                      val dstIp = packet.copyOfRange(16, 20)

                      val srcPort = ((packet[ihl].toInt() and 0xFF) shl 8) or (packet[ihl + 1].toInt() and 0xFF)

                      val dstPort = ((packet[ihl + 2].toInt() and 0xFF) shl 8) or (packet[ihl + 3].toInt() and 0xFF)

                      val udpPayloadOffset = ihl + 8

                      val udpPayloadLength = length - udpPayloadOffset

                      if (udpPayloadLength <= 0) return



                      val payload = packet.copyOfRange(udpPayloadOffset, length)

                      Thread {

                          var socket: DatagramSocket? = null

                          try {

                              socket = DatagramSocket()

                              protect(socket)

                              socket.soTimeout = 5000

                              val serverAddr = InetAddress.getByAddress(dstIp)

                              socket.send(DatagramPacket(payload, payload.size, serverAddr, dstPort))



                              val respBuf = ByteArray(1500)

                              val respPacket = DatagramPacket(respBuf, respBuf.size)

                              socket.receive(respPacket)



                              val respData = respPacket.data

                              val respLen = respPacket.length

                              val totalLen = 20 + 8 + respLen

                              val outPacket = ByteArray(totalLen)



                              outPacket[0] = 0x45.toByte()

                              outPacket[1] = 0

                              outPacket[2] = ((totalLen ushr 8) and 0xFF).toByte()

                              outPacket[3] = (totalLen and 0xFF).toByte()

                              outPacket[4] = 0

                              outPacket[5] = 0

                              outPacket[6] = 0x40.toByte()

                              outPacket[7] = 0

                              outPacket[8] = 64.toByte()

                              outPacket[9] = 17.toByte()

                              System.arraycopy(dstIp, 0, outPacket, 12, 4)

                              System.arraycopy(srcIp, 0, outPacket, 16, 4)



                              var sum = 0

                              for (i in 0 until 20 step 2) {

                                  val word = ((outPacket[i].toInt() and 0xFF) shl 8) or (outPacket[i + 1].toInt() and 0xFF)

                                  sum += word

                              }

                              while ((sum ushr 16) != 0) {

                                  sum = (sum and 0xFFFF) + (sum ushr 16)

                              }

                              val checksum = sum.inv() and 0xFFFF

                              outPacket[10] = ((checksum ushr 8) and 0xFF).toByte()

                              outPacket[11] = (checksum and 0xFF).toByte()



                              val udpLen = 8 + respLen

                              outPacket[20] = ((dstPort ushr 8) and 0xFF).toByte()

                              outPacket[21] = (dstPort and 0xFF).toByte()

                              outPacket[22] = ((srcPort ushr 8) and 0xFF).toByte()

                              outPacket[23] = (srcPort and 0xFF).toByte()

                              outPacket[24] = ((udpLen ushr 8) and 0xFF).toByte()

                              outPacket[25] = (udpLen and 0xFF).toByte()

                              outPacket[26] = 0

                              outPacket[27] = 0

                              System.arraycopy(respData, 0, outPacket, 28, respLen)



                              synchronized(outputStream) {

                                  outputStream.write(outPacket)

                                  outputStream.flush()

                              }

                          } catch (_: Exception) {

                          } finally {

                              socket?.close()

                          }

                      }.start()

                  }



                  private fun startForegroundServiceWithNotification() {

                      val manager = getSystemService(NotificationManager::class.java)

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {

                          val channel = NotificationChannel(

                              CHANNEL_ID,

                              "Статус защиты",

                              NotificationManager.IMPORTANCE_LOW

                          )

                          manager.createNotificationChannel(channel)

                      }

                      val pendingIntent = PendingIntent.getActivity(

                          this,

                          0,

                          Intent(this, MainActivity::class.java),

                          PendingIntent.FLAG_IMMUTABLE

                      )

                      val notification: Notification = NotificationCompat.Builder(this, CHANNEL_ID)

                          .setContentTitle("🛡️ Детский Щит активен")

                          .setContentText("Реклама в мини-играх и браузере заблокирована")

                          .setSmallIcon(android.R.drawable.ic_secure)

                          .setContentIntent(pendingIntent)

                          .setOngoing(true)

                          .build()



                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {

                          startForeground(

                              NOTIFICATION_ID,

                              notification,

                              ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE

                          )

                      } else {

                          startForeground(NOTIFICATION_ID, notification)

                      }

                  }



                  private fun stopVpn() {

                      shouldRun.set(false)

                      vpnThread?.interrupt()

                      vpnThread = null

                      try {

                          vpnInterface?.close()

                      } catch (e: Exception) {

                          e.printStackTrace()

                      } finally {

                          vpnInterface = null

                          isRunning = false

                          ServiceCompat.stopForeground(this, ServiceCompat.STOP_FOREGROUND_REMOVE)

                          stopSelf()

                      }

                  }



                  override fun onRevoke() {

                      stopVpn()

                      super.onRevoke()

                  }



                  override fun onDestroy() {

                      stopVpn()

                      super.onDestroy()

                  }

              }

          """)



          write("app/src/main/java/com/example/kidsadblocker/MainActivity.kt", """

              package com.example.kidsadblocker



              import android.Manifest

              import android.content.Intent

              import android.content.pm.PackageManager

              import android.content.res.ColorStateList

              import android.graphics.Color

              import android.net.VpnService

              import android.os.Build

              import android.os.Bundle

              import android.text.InputType

              import android.widget.Button

              import android.widget.EditText

              import android.widget.TextView

              import android.widget.Toast

              import androidx.activity.result.contract.ActivityResultContracts

              import androidx.appcompat.app.AlertDialog

              import androidx.appcompat.app.AppCompatActivity

              import androidx.core.content.ContextCompat



              class MainActivity : AppCompatActivity() {

                  private lateinit var tvShieldIcon: TextView

                  private lateinit var tvStatusTitle: TextView

                  private lateinit var tvStatusDesc: TextView

                  private lateinit var btnPower: Button

                  private val PARENT_PIN = "0000"



                  private val vpnPermissionLauncher = registerForActivityResult(

                      ActivityResultContracts.StartActivityForResult()

                  ) { result ->

                      if (result.resultCode == RESULT_OK) {

                          startVpnService()

                      } else {

                          Toast.makeText(this, "Разрешите подключение для блокировки рекламы!", Toast.LENGTH_LONG).show()

                      }

                  }



                  private val notificationPermissionLauncher = registerForActivityResult(

                      ActivityResultContracts.RequestPermission()

                  ) { _ ->

                      prepareAndStartVpn()

                  }



                  override fun onCreate(savedInstanceState: Bundle?) {

                      super.onCreate(savedInstanceState)

                      setContentView(R.layout.activity_main)

                      tvShieldIcon = findViewById(R.id.tvShieldIcon)

                      tvStatusTitle = findViewById(R.id.tvStatusTitle)

                      tvStatusDesc = findViewById(R.id.tvStatusDesc)

                      btnPower = findViewById(R.id.btnPower)

                      updateUi()

                      btnPower.setOnClickListener {

                          if (AdBlockVpnService.isRunning) {

                              showPinDialog()

                          } else {

                              checkPermissionsAndStartVpn()

                          }

                      }

                  }



                  override fun onResume() {

                      super.onResume()

                      updateUi()

                  }



                  private fun checkPermissionsAndStartVpn() {

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&

                          ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED

                      ) {

                          notificationPermissionLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)

                      } else {

                          prepareAndStartVpn()

                      }

                  }



                  private fun showPinDialog() {

                      val input = EditText(this).apply {

                          inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD

                          hint = "ПИН-код (0000)"

                          textAlignment = EditText.TEXT_ALIGNMENT_CENTER

                      }

                      AlertDialog.Builder(this)

                          .setTitle("🔒 Родительский контроль")

                          .setMessage("Введите ПИН-код для отключения защиты:")

                          .setView(input)

                          .setPositiveButton("ОК") { _, _ ->

                              if (input.text.toString() == PARENT_PIN) {

                                  stopVpnService()

                                  Toast.makeText(this, "Защита отключена", Toast.LENGTH_SHORT).show()

                              } else {

                                  Toast.makeText(this, "❌ Неверный ПИН-код!", Toast.LENGTH_LONG).show()

                              }

                          }

                          .setNegativeButton("Отмена", null)

                          .show()

                  }



                  private fun prepareAndStartVpn() {

                      val intent = VpnService.prepare(this)

                      if (intent != null) {

                          vpnPermissionLauncher.launch(intent)

                      } else {

                          startVpnService()

                      }

                  }



                  private fun startVpnService() {

                      val intent = Intent(this, AdBlockVpnService::class.java)

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {

                          startForegroundService(intent)

                      } else {

                          startService(intent)

                      }

                      btnPower.postDelayed({ updateUi() }, 400)

                  }



                  private fun stopVpnService() {

                      val intent = Intent(this, AdBlockVpnService::class.java).apply {

                          action = AdBlockVpnService.ACTION_STOP

                      }

                      startService(intent)

                      btnPower.postDelayed({ updateUi() }, 400)

                  }



                  private fun updateUi() {

                      if (AdBlockVpnService.isRunning) {

                          tvShieldIcon.text = "🛡️"

                          tvStatusTitle.text = "ЗАЩИТА АКТИВНА"

                          tvStatusTitle.setTextColor(Color.parseColor("#00E676"))

                          tvStatusDesc.text = "Реклама в играх и браузере заблокирована"

                          btnPower.text = "ВЫКЛЮЧИТЬ РУБИЛЬНИК"

                          btnPower.backgroundTintList = ColorStateList.valueOf(Color.parseColor("#FF5252"))

                      } else {

                          tvShieldIcon.text = "⚠️"

                          tvStatusTitle.text = "ЗАЩИТА ОТКЛЮЧЕНА"

                          tvStatusTitle.setTextColor(Color.parseColor("#FF5252"))

                          tvStatusDesc.text = "Нажмите кнопку ниже для включения фильтра"

                          btnPower.text = "ВКЛЮЧИТЬ РУБИЛЬНИК"

                          btnPower.backgroundTintList = ColorStateList.valueOf(Color.parseColor("#00C853"))

                      }

                  }

              }

          """)

          print("Android project files generated successfully!")



      - name: Setup Gradle

        uses: gradle/actions/setup-gradle@v4

        with:

          gradle-version: '8.5'



      - name: Build Debug APK

        run: gradle assembleDebug --stacktrace



      - name: Upload Android APK

        uses: actions/upload-artifact@v4

        with:

          name: KidsShield-Android-APK

          path: app/build/outputs/apk/debug/app-debug.apk



  build-windows:

    name: Build Windows EXE

    runs-on: windows-latest



    steps:

      - name: Set up Python 3.11

        uses: actions/setup-python@v5

        with:

          python-version: '3.11'



      - name: Generate Windows App & Build EXE

        shell: python

        run: |

          import subprocess

          import sys

          import textwrap



          win_app = """

              import ctypes

              import subprocess

              import sys

              import tkinter as tk

              from tkinter import messagebox, simpledialog



              PARENT_PIN = "0000"

              DNS_PRIMARY = "94.140.14.15"

              DNS_SECONDARY = "94.140.15.16"

              CREATE_NO_WINDOW = 0x08000000



              def is_admin():

                  try:

                      return ctypes.windll.shell32.IsUserAnAdmin() != 0

                  except Exception:

                      return False



              def run_ps(cmd):

                  return subprocess.run(

                      ["powershell", "-NoProfile", "-NonInteractive", "-Command", cmd],

                      capture_output=True,

                      text=True,

                      creationflags=CREATE_NO_WINDOW

                  )



              def check_shield_active():

                  res = run_ps("Get-DnsClientServerAddress -AddressFamily IPv4 | Select-Object -ExpandProperty ServerAddresses")

                  return DNS_PRIMARY in (res.stdout or "")



              def enable_shield():

                  ps_cmd = (

                      "$adapters = Get-NetAdapter | Where-Object { $_.Status -eq 'Up' }; "

                      "foreach ($a in $adapters) { "

                      f"Set-DnsClientServerAddress -InterfaceIndex $a.ifIndex -ServerAddresses ('{DNS_PRIMARY}','{DNS_SECONDARY}') "

                      "}; "

                      "Clear-DnsClientCache"

                  )

                  res = run_ps(ps_cmd)

                  return res.returncode == 0



              def disable_shield():

                  ps_cmd = (

                      "$adapters = Get-NetAdapter | Where-Object { $_.Status -eq 'Up' }; "

                      "foreach ($a in $adapters) { "

                      "Set-DnsClientServerAddress -InterfaceIndex $a.ifIndex -ResetServerAddresses "

                      "}; "

                      "Clear-DnsClientCache"

                  )

                  res = run_ps(ps_cmd)

                  return res.returncode == 0



              class KidsShieldWindowsApp:

                  def __init__(self, root):

                      self.root = root

                      self.root.title("Детский Щит (Windows)")

                      self.root.geometry("420x540")

                      self.root.resizable(False, False)

                      self.root.configure(bg="#121824")



                      self.is_running = check_shield_active()



                      tk.Label(

                          root,

                          text="ДЕТСКИЙ ЩИТ",

                          font=("Segoe UI", 22, "bold"),

                          fg="#FFFFFF",

                          bg="#121824"

                      ).pack(pady=(32, 4))



                      tk.Label(

                          root,

                          text="Блокировка рекламы в играх и браузере",

                          font=("Segoe UI", 10),

                          fg="#8A99AD",

                          bg="#121824"

                      ).pack(pady=(0, 32))



                      self.card = tk.Frame(root, bg="#1E2638", padx=28, pady=28)

                      self.card.pack(fill="x", padx=24, pady=(0, 36))



                      self.lbl_icon = tk.Label(

                          self.card,

                          text="⚠️",

                          font=("Segoe UI Emoji", 42),

                          bg="#1E2638",

                          fg="#FFFFFF"

                      )

                      self.lbl_icon.pack(pady=(0, 10))



                      self.lbl_status = tk.Label(

                          self.card,

                          text="ЗАЩИТА ОТКЛЮЧЕНА",

                          font=("Segoe UI", 15, "bold"),

                          bg="#1E2638",

                          fg="#FF5252"

                      )

                      self.lbl_status.pack()



                      self.lbl_desc = tk.Label(

                          self.card,

                          text="Реклама в мини-играх не блокируется",

                          font=("Segoe UI", 10),

                          bg="#1E2638",

                          fg="#8A99AD"

                      )

                      self.lbl_desc.pack(pady=(6, 0))



                      self.btn_power = tk.Button(

                          root,

                          text="ВКЛЮЧИТЬ РУБИЛЬНИК",

                          font=("Segoe UI", 13, "bold"),

                          fg="#FFFFFF",

                          bg="#00C853",

                          activebackground="#00E676",

                          activeforeground="#FFFFFF",

                          relief="flat",

                          cursor="hand2",

                          height=2,

                          command=self.toggle_shield

                      )

                      self.btn_power.pack(fill="x", padx=24)



                      tk.Label(

                          root,

                          text="🔒 Выключение защищено ПИН-кодом (0000)",

                          font=("Segoe UI", 9),

                          fg="#5C6B7F",

                          bg="#121824"

                      ).pack(pady=(28, 0))



                      self.update_ui()



                  def toggle_shield(self):

                      if self.is_running:

                          pin = simpledialog.askstring(

                              "🔒 Родительский контроль",

                              "Введите ПИН-код для отключения защиты:",

                              show="*",

                              parent=self.root

                          )

                          if pin is None:

                              return

                          if pin == PARENT_PIN:

                              if disable_shield():

                                  self.is_running = False

                                  self.update_ui()

                                  messagebox.showinfo("Детский Щит", "Защита отключена.")

                              else:

                                  messagebox.showerror("Ошибка", "Не удалось сбросить настройки DNS. Запустите программу от имени Администратора.")

                          else:

                              messagebox.showwarning("Родительский контроль", "❌ Неверный ПИН-код!")

                      else:

                          if enable_shield():

                              self.is_running = True

                              self.update_ui()

                          else:

                              messagebox.showerror("Ошибка", "Не удалось включить DNS-фильтр. Запустите программу от имени Администратора.")



                  def update_ui(self):

                      if self.is_running:

                          self.lbl_icon.config(text="🛡️")

                          self.lbl_status.config(text="ЗАЩИТА АКТИВНА", fg="#00E676")

                          self.lbl_desc.config(text="Реклама в играх и браузере заблокирована")

                          self.btn_power.config(text="ВЫКЛЮЧИТЬ РУБИЛЬНИК", bg="#FF5252", activebackground="#FF1744")

                      else:

                          self.lbl_icon.config(text="⚠️")

                          self.lbl_status.config(text="ЗАЩИТА ОТКЛЮЧЕНА", fg="#FF5252")

                          self.lbl_desc.config(text="Нажмите кнопку ниже для включения фильтра")

                          self.btn_power.config(text="ВКЛЮЧИТЬ РУБИЛЬНИК", bg="#00C853", activebackground="#00E676")



              if __name__ == "__main__":

                  if not is_admin():

                      ctypes.windll.shell32.ShellExecuteW(

                          None, "runas", sys.executable, " ".join(sys.argv), None, 1

                      )

                      sys.exit(0)

                  app_root = tk.Tk()

                  KidsShieldWindowsApp(app_root)

                  app_root.mainloop()

          """



          with open("kidsshield_win.py", "w", encoding="utf-8") as f:

