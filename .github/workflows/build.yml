name: Build KidsShield APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Project & Build APK
        run: |
          mkdir -p app/src/main/java/com/example/kidsadblocker
          mkdir -p app/src/main/res/layout

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KidsShield"
          include ':app'
          EOF
          sed -i 's/^          //' settings.gradle

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          sed -i 's/^          //' gradle.properties

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF
          sed -i 's/^          //' build.gradle

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.kidsadblocker'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.kidsadblocker"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF
          sed -i 's/^          //' app/build.gradle

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_secure"
                  android:label="Детский Щит"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".AdBlockVpnService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:foregroundServiceType="specialUse"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF
          sed -i 's/^          //' app/src/main/AndroidManifest.xml

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center_horizontal"
              android:padding="24dp"
              android:background="#121824">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="ДЕТСКИЙ ЩИТ"
                  android:textSize="28sp"
                  android:textStyle="bold"
                  android:textColor="#FFFFFF"
                  android:layout_marginTop="32dp"/>
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Блокировка рекламы в играх и браузере"
                  android:textSize="14sp"
                  android:textColor="#8A99AD"
                  android:layout_marginTop="8dp"
                  android:layout_marginBottom="48dp"/>
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:gravity="center"
                  android:padding="28dp"
                  android:background="#1E2638"
                  android:layout_marginBottom="48dp">
                  <TextView
                      android:id="@+id/tvShieldIcon"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="⚠️"
                      android:textSize="56sp"
                      android:layout_marginBottom="12dp"/>
                  <TextView
                      android:id="@+id/tvStatusTitle"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="ЗАЩИТА ОТКЛЮЧЕНА"
                      android:textSize="20sp"
                      android:textStyle="bold"
                      android:textColor="#FF5252"/>
                  <TextView
                      android:id="@+id/tvStatusDesc"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Реклама в мини-играх не блокируется"
                      android:textSize="14sp"
                      android:textColor="#8A99AD"
                      android:gravity="center"
                      android:layout_marginTop="6dp"/>
              </LinearLayout>
              <Button
                  android:id="@+id/btnPower"
                  android:layout_width="match_parent"
                  android:layout_height="76dp"
                  android:text="ВКЛЮЧИТЬ РУБИЛЬНИК"
                  android:textSize="18sp"
                  android:textStyle="bold"
                  android:textColor="#FFFFFF"
                  android:backgroundTint="#00C853"/>
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="🔒 Выключение защищено ПИН-кодом (0000)"
                  android:textSize="13sp"
                  android:textColor="#5C6B7F"
                  android:layout_marginTop="32dp"/>
          </LinearLayout>
          EOF
          sed -i 's/^          //' app/src/main/res/layout/activity_main.xml

          cat << 'EOF' > app/src/main/java/com/example/kidsadblocker/AdBlockVpnService.kt
          package com.example.kidsadblocker
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Intent
          import android.net.VpnService
          import android.os.Build
          import android.os.ParcelFileDescriptor
          import androidx.core.app.NotificationCompat

          class AdBlockVpnService : VpnService() {
              private var vpnInterface: ParcelFileDescriptor? = null
              companion object {
                  var isRunning = false
                  const val ACTION_STOP = "ACTION_STOP_VPN"
                  private const val CHANNEL_ID = "KidsShieldChannel"
                  private const val NOTIFICATION_ID = 101
              }
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopVpn()
                      return START_NOT_STICKY
                  }
                  startForegroundServiceWithNotification()
                  startVpn()
                  return START_STICKY
              }
              private fun startVpn() {
                  if (vpnInterface != null) return
                  try {
                      val builder = Builder()
                      builder.setSession("KidsShieldVPN")
                      builder.setMtu(1500)
                      builder.addAddress("10.0.0.2", 32)
                      val dns1 = "94.140.14.15"
                      val dns2 = "94.140.15.16"
                      builder.addDnsServer(dns1)
                      builder.addDnsServer(dns2)
                      builder.addRoute(dns1, 32)
                      builder.addRoute(dns2, 32)
                      vpnInterface = builder.establish()
                      isRunning = true
                  } catch (e: Exception) {
                      e.printStackTrace()
                      stopVpn()
                  }
