  build-apple:

    name: Build Apple (macOS App & iOS/iPadOS Profile)

    runs-on: macos-latest



    steps:

      - name: Generate macOS App & iOS/macOS DNS Profile

        shell: python3

        run: |

          import os

          import subprocess

          import textwrap



          def write(path, content):

              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)

              with open(path, "w", encoding="utf-8") as f:

                  f.write(textwrap.dedent(content).strip() + "\n")



          write("output/KidsShield-iOS-macOS.mobileconfig", """

              <?xml version="1.0" encoding="UTF-8"?>

              <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

              <plist version="1.0">

              <dict>

                  <key>PayloadContent</key>

                  <array>

                      <dict>

                          <key>DNSSettings</key>

                          <dict>

                              <key>DNSProtocol</key>

                              <string>HTTPS</string>

                              <key>ServerAddresses</key>

                              <array>

                                  <string>94.140.14.15</string>

                                  <string>94.140.15.16</string>

                              </array>

                              <key>ServerURL</key>

                              <string>https://family.adguard-dns.com/dns-query</string>

                          </dict>

                          <key>PayloadDescription</key>

                          <string>Блокировка рекламы и взрослого контента в играх и браузере (AdGuard Family DNS)</string>

                          <key>PayloadDisplayName</key>

                          <string>Детский Щит DNS</string>

                          <key>PayloadIdentifier</key>

                          <string>com.example.kidsadblocker.dns</string>

                          <key>PayloadType</key>

                          <string>com.apple.dnsSettings.managed</string>

                          <key>PayloadUUID</key>

                          <string>7A9E62B0-3C14-4F8B-9B12-1029384756AB</string>

                          <key>PayloadVersion</key>

                          <integer>1</integer>

                      </dict>

                      <dict>

                          <key>PayloadDescription</key>

                          <string>Защита профиля от удаления без ПИН-кода (0000)</string>

                          <key>PayloadDisplayName</key>

                          <string>Родительский ПИН-код</string>

                          <key>PayloadIdentifier</key>

                          <string>com.example.kidsadblocker.removalpassword</string>

                          <key>PayloadType</key>

                          <string>com.apple.profileRemovalPassword</string>

                          <key>PayloadUUID</key>

                          <string>8B0F73C1-4D25-4A9C-8C23-2130495867BC</string>

                          <key>PayloadVersion</key>

                          <integer>1</integer>

                          <key>RemovalPassword</key>

                          <string>0000</string>

                      </dict>

                  </array>

                  <key>PayloadDescription</key>

                  <string>Детский Щит: системная блокировка рекламы в играх и Safari на iPhone, iPad и Mac. ПИН-код для удаления: 0000.</string>

                  <key>PayloadDisplayName</key>

                  <string>🛡️ Детский Щит (iOS / iPadOS / macOS)</string>

                  <key>PayloadIdentifier</key>

                  <string>com.example.kidsadblocker.profile</string>

                  <key>PayloadOrganization</key>

                  <string>KidsShield</string>

                  <key>PayloadRemovalDisallowed</key>

                  <true/>

                  <key>PayloadType</key>

                  <string>Configuration</string>

                  <key>PayloadUUID</key>

                  <string>6F8D51A9-2B03-4E7A-8A01-0918273645FA</string>

                  <key>PayloadVersion</key>

                  <integer>1</integer>

              </dict>

              </plist>

          """)



          write("KidsShield.swift", """

              import Cocoa

              import SwiftUI



              let parentPin = "0000"

              let dnsPrimary = "94.140.14.15"

              let dnsSecondary = "94.140.15.16"



              class ShieldManager: ObservableObject {

                  @Published var isRunning: Bool = false



                  init() {

                      checkStatus()

                  }



                  func checkStatus() {

                      let task = Process()

                      task.launchPath = "/usr/sbin/scutil"

                      task.arguments = ["--dns"]

                      let pipe = Pipe()

                      task.standardOutput = pipe

                      do {

                          try task.run()

                          task.waitUntilExit()

                          let data = pipe.fileHandleForReading.readDataToEndOfFile()

                          let output = String(data: data, encoding: .utf8) ?? ""

                          DispatchQueue.main.async {

                              self.isRunning = output.contains(dnsPrimary)

                          }

                      } catch {

                          DispatchQueue.main.async {

                              self.isRunning = false

                          }

                      }

                  }



                  func enableShield() {

                      let script = \"\"\"

                      do shell script "for s in $(networksetup -listallnetworkservices | tail -n +2 | sed 's/^\\\\*//'); do networksetup -setdnsservers \\"$s\\" \(dnsPrimary) \(dnsSecondary) 2>/dev/null || true; done; dscacheutil -flushcache; killall -HUP mDNSResponder 2>/dev/null || true" with administrator privileges

                      \"\"\"

                      if runAppleScript(script) {

                          isRunning = true

                      }

                  }



                  func disableShield() {

                      let script = \"\"\"

                      do shell script "for s in $(networksetup -listallnetworkservices | tail -n +2 | sed 's/^\\\\*//'); do networksetup -setdnsservers \\"$s\\" Empty 2>/dev/null || true; done; dscacheutil -flushcache; killall -HUP mDNSResponder 2>/dev/null || true" with administrator privileges

                      \"\"\"

                      if runAppleScript(script) {

                          isRunning = false

                      }

                  }



                  private func runAppleScript(_ source: String) -> Bool {

                      var error: NSDictionary?

                      if let scriptObject = NSAppleScript(source: source) {

                          scriptObject.executeAndReturnError(&error)

                          return error == nil

                      }

                      return false

                  }

              }



              struct ContentView: View {

                  @StateObject private var manager = ShieldManager()

                  @State private var showPinPrompt = false

                  @State private var pinInput = ""

                  @State private var showWrongPinAlert = false



                  var body: some View {

                      VStack(spacing: 0) {

                          Text("ДЕТСКИЙ ЩИТ")

                              .font(.system(size: 26, weight: .bold))

                              .foregroundColor(.white)

                              .padding(.top, 32)



                          Text("Блокировка рекламы в играх и браузере")

                              .font(.system(size: 13))

                              .foregroundColor(Color(red: 0.54, green: 0.60, blue: 0.68))

                              .padding(.top, 6)

                              .padding(.bottom, 36)



                          VStack(spacing: 10) {

                              Text(manager.isRunning ? "🛡️" : "⚠️")

                                  .font(.system(size: 52))

                              Text(manager.isRunning ? "ЗАЩИТА АКТИВНА" : "ЗАЩИТА ОТКЛЮЧЕНА")

                                  .font(.system(size: 18, weight: .bold))

                                  .foregroundColor(manager.isRunning

                                      ? Color(red: 0.0, green: 0.90, blue: 0.46)

                                      : Color(red: 1.0, green: 0.32, blue: 0.32))

                              Text(manager.isRunning

                                  ? "Реклама в играх и браузере заблокирована"

                                  : "Нажмите кнопку ниже для включения фильтра")

                                  .font(.system(size: 13))

                                  .foregroundColor(Color(red: 0.54, green: 0.60, blue: 0.68))

                                  .multilineTextAlignment(.center)

                          }

                          .frame(maxWidth: .infinity)

                          .padding(26)

                          .background(Color(red: 0.12, green: 0.15, blue: 0.22))

                          .cornerRadius(12)

                          .padding(.horizontal, 24)

                          .padding(.bottom, 36)



                          Button(action: {

                              if manager.isRunning {

                                  pinInput = ""

                                  showPinPrompt = true

                              } else {

                                  manager.enableShield()

                              }

                          }) {

                              Text(manager.isRunning ? "ВЫКЛЮЧИТЬ РУБИЛЬНИК" : "ВКЛЮЧИТЬ РУБИЛЬНИК")

                                  .font(.system(size: 16, weight: .bold))

                                  .foregroundColor(.white)

                                  .frame(maxWidth: .infinity)

                                  .frame(height: 60)

                                  .background(manager.isRunning

                                      ? Color(red: 1.0, green: 0.32, blue: 0.32)

                                      : Color(red: 0.0, green: 0.78, blue: 0.33))

                                  .cornerRadius(10)

                          }

                          .buttonStyle(PlainButtonStyle())

                          .padding(.horizontal, 24)



                          Text("🔒 Выключение защищено ПИН-кодом (0000)")

                              .font(.system(size: 12))

                              .foregroundColor(Color(red: 0.36, green: 0.42, blue: 0.50))

                              .padding(.top, 28)



                          Spacer()

                      }

                      .frame(width: 400, height: 500)

                      .background(Color(red: 0.07, green: 0.09, blue: 0.14))

                      .sheet(isPresented: $showPinPrompt) {

                          VStack(spacing: 16) {

                              Text("🔒 Родительский контроль")

                                  .font(.headline)

                              Text("Введите ПИН-код для отключения защиты:")

                                  .font(.subheadline)

                              SecureField("ПИН-код (0000)", text: $pinInput)

                                  .textFieldStyle(RoundedBorderTextFieldStyle())

                                  .frame(width: 180)

                              HStack(spacing: 12) {

                                  Button("Отмена") {

                                      showPinPrompt = false

                                  }

                                  Button("ОК") {

                                      showPinPrompt = false

                                      if pinInput == parentPin {

                                          manager.disableShield()

                                      } else {

                                          showWrongPinAlert = true

                                      }

                                  }

                              }

                          }

                          .padding(24)

                          .frame(width: 300, height: 180)

                      }

                      .alert(isPresented: $showWrongPinAlert) {

                          Alert(

                              title: Text("Ошибка"),

                              message: Text("❌ Неверный ПИН-код!"),

                              dismissButton: .default(Text("ОК"))

                          )

                      }

                  }

              }



              class AppDelegate: NSObject, NSApplicationDelegate {

                  var window: NSWindow!

                  func applicationDidFinishLaunching(_ notification: Notification) {

                      let contentView = ContentView()

                      window = NSWindow(

                          contentRect: NSRect(x: 0, y: 0, width: 400, height: 500),

                          styleMask: [.titled, .closable, .miniaturizable],

                          backing: .buffered,

                          defer: false

                      )

                      window.center()

                      window.title = "Детский Щит"

                      window.contentView = NSHostingView(rootView: contentView)

                      window.makeKeyAndOrderFront(nil)

                      NSApp.activate(ignoringOtherApps: true)

                  }

                  func applicationShouldTerminateAfterLastWindowClosed(_ sender: NSApplication) -> Bool {

                      return true

                  }

              }



              let app = NSApplication.shared

              let delegate = AppDelegate()

              app.delegate = delegate

              app.setActivationPolicy(.regular)

              app.run()

          """)



          os.makedirs("KidsShield.app/Contents/MacOS", exist_ok=True)

          write("KidsShield.app/Contents/Info.plist", """

              <?xml version="1.0" encoding="UTF-8"?>

              <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

              <plist version="1.0">

              <dict>

                  <key>CFBundleExecutable</key>

                  <string>KidsShield</string>

                  <key>CFBundleIdentifier</key>

                  <string>com.example.kidsadblocker.mac</string>

                  <key>CFBundleName</key>

                  <string>Детский Щит</string>

                  <key>CFBundlePackageType</key>

                  <string>APPL</string>

                  <key>CFBundleShortVersionString</key>

                  <string>1.0</string>

                  <key>LSMinimumSystemVersion</key>

                  <string>11.0</string>

                  <key>NSHighResolutionCapable</key>

                  <true/>

              </dict>

              </plist>

          """)



          subprocess.check_call([

              "swiftc", "KidsShield.swift",

              "-o", "KidsShield.app/Contents/MacOS/KidsShield"

          ])

          subprocess.check_call([

              "ditto", "-c", "-k", "--sequesterRsrc", "--keepParent",

              "KidsShield.app", "output/KidsShield-macOS.zip"

          ])



